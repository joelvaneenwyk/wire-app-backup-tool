name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DEFAULT_JAVA_VERSION: 17

jobs:
  test:
    runs-on: "${{ matrix.os }}-latest"
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu]
        java: [17]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          # Running setup-java again overwrites the settings.xml
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build application
        run: |
          ./gradlew assemble

      - name: Run tests application
        run: |
          ./gradlew test --info

  build_server:
    needs: test
    runs-on: ubuntu-20.04
    name: Build Server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # extract metadata for labels https://github.com/crazy-max/ghaction-docker-meta
      - name: Docker meta
        id: docker_meta
        uses: crazy-max/ghaction-docker-meta@v5
        with:
          images: quay.io/joelvaneenwyk/wire-app-backup-tool

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # setup docker actions https://github.com/docker/build-push-action
      - name: Build
        id: docker_build
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          push: false

  jar_release:
    needs: test
    name: Release (Jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          # Running setup-java again overwrites the settings.xml
          distribution: "temurin"
          java-version: ${{ env.DEFAULT_JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Jar
        run: |
          ./gradlew shadowJar

      # Creates release zip
      - name: Create release zip
        run: |
          cp app/build/libs/backup-export.jar .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-export
          path: |
            backup-export.jar
            libs/**
            README.md
